<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .play-btn {
    font: bold 1.5em sans-serif;
    color: #222;
    background: #ffcc00;
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
  }
  .play-btn:hover {
    filter: brightness(1.1);
  }
  #title {
    font-size: 3em;
    text-align: center;
  }
  #title span {
    display: inline-block;
    cursor: pointer;
  }
  #title span.bounce {
    animation: jelly 0.8s ease;
    transform-origin: bottom center;
  }
  @keyframes jelly {
    0%, 100% { transform: scale(1, 1); }
    25% { transform: scale(0.75, 1.3); }
    40% { transform: scale(1.3, 0.75); }
    55% { transform: scale(0.85, 1.15); }
    70% { transform: scale(1.1, 0.9); }
    85% { transform: scale(0.97, 1.03); }
  }
</style>

<h1 id="title">Hello from my arcade</h1>
<a class="play-btn" href="game.html">Play Games</a>

<script>
  const title = document.getElementById("title");
  const letters = title.textContent.split("");
  title.textContent = "";

  letters.forEach((letter, i) => {
    const span = document.createElement("span");
    span.textContent = letter === " " ? " " : letter;
    span.style.color = `hsl(${(i / letters.length) * 300}, 90%, 50%)`;
    span.addEventListener("click", () => {
      span.classList.remove("bounce");
      void span.offsetWidth; // restart the animation if clicked again
      span.classList.add("bounce");
    });
    title.appendChild(span);
  });
</script>

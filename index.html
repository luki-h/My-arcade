<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    /* Galaxy: nebula clouds over deep space */
    background:
      radial-gradient(ellipse at 20% 30%, rgba(140, 60, 220, 0.45), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(40, 110, 230, 0.4), transparent 55%),
      radial-gradient(ellipse at 60% 20%, rgba(230, 60, 160, 0.25), transparent 50%),
      linear-gradient(160deg, #05030f, #0d0a2b 50%, #04020c);
    background-attachment: fixed;
  }
  #stars {
    position: fixed;
    inset: 0;
    z-index: -1;
  }
  .play-btn {
    font: bold 1.5em sans-serif;
    color: #222;
    background: #ffcc00;
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
  }
  .play-btn:hover {
    filter: brightness(1.1);
  }
  #title {
    font-size: 3em;
    text-align: center;
    padding: 0.2em 0.6em;
    border-radius: 20px;
    /* Dark backing so the letters never blend into the galaxy */
    background: rgba(0, 0, 0, 0.45);
  }
  #title span {
    display: inline-block;
    cursor: pointer;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 3px 6px #000;
  }
  #title span.bounce {
    animation: jelly 0.8s ease;
    transform-origin: bottom center;
  }
  @keyframes jelly {
    0%, 100% { transform: scale(1, 1); }
    25% { transform: scale(0.75, 1.3); }
    40% { transform: scale(1.3, 0.75); }
    55% { transform: scale(0.85, 1.15); }
    70% { transform: scale(1.1, 0.9); }
    85% { transform: scale(0.97, 1.03); }
  }
</style>

<canvas id="stars"></canvas>
<h1 id="title">Hello from my arcade</h1>
<a class="play-btn" href="game.html">Play Games</a>

<script src="boing.js"></script>
<script>
  const title = document.getElementById("title");
  const letters = title.textContent.split("");
  title.textContent = "";

  letters.forEach((letter, i) => {
    const span = document.createElement("span");
    span.textContent = letter === " " ? " " : letter;
    span.style.color = `hsl(${(i / letters.length) * 300}, 100%, 65%)`;
    span.addEventListener("click", () => {
      span.classList.remove("bounce");
      void span.offsetWidth; // restart the animation if clicked again
      span.classList.add("bounce");
      boing(i / letters.length);
    });
    title.appendChild(span);
  });

  // Twinkling starfield
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 2500) }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.03 + 0.01,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.phase += s.speed;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(s.phase);
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  draw();
</script>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    /* Galaxy: nebula clouds over deep space */
    background:
      radial-gradient(ellipse at 20% 30%, rgba(140, 60, 220, 0.45), transparent 55%),
      radial-gradient(ellipse at 80% 70%, rgba(40, 110, 230, 0.4), transparent 55%),
      radial-gradient(ellipse at 60% 20%, rgba(230, 60, 160, 0.25), transparent 50%),
      linear-gradient(160deg, #05030f, #0d0a2b 50%, #04020c);
    background-attachment: fixed;
  }
  #stars {
    position: fixed;
    inset: 0;
    z-index: -1;
  }
  .play-btn {
    font: bold 1.5em sans-serif;
    color: #222;
    background: #ffcc00;
    padding: 14px 32px;
    border-radius: 12px;
    text-decoration: none;
    box-shadow: 0 0 20px rgba(255, 204, 0, 0.6);
  }
  .play-btn:hover {
    filter: brightness(1.1);
  }
  #title {
    font-family: "Pacifico", cursive;
    font-weight: normal;   /* Pacifico only comes in one weight; faking bold smudges it */
    font-size: 3em;
    text-align: center;
    padding: 0.2em 0.6em;
    border-radius: 20px;
    /* Dark backing so the letters never blend into the galaxy */
    background: rgba(0, 0, 0, 0.45);
  }
  #title span {
    display: inline-block;
    cursor: pointer;
    -webkit-text-stroke: 2px #000;
    paint-order: stroke fill;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.7), 0 3px 6px #000;
  }
  #title span.bounce {
    animation: jelly 0.8s ease;
    transform-origin: bottom center;
  }
  @keyframes jelly {
    0%, 100% { transform: scale(1, 1); }
    25% { transform: scale(0.75, 1.3); }
    40% { transform: scale(1.3, 0.75); }
    55% { transform: scale(0.85, 1.15); }
    70% { transform: scale(1.1, 0.9); }
    85% { transform: scale(0.97, 1.03); }
  }

  /* Tasty hamburger menu button: bun, lettuce, cheese, patty, bun */
  .burger {
    position: fixed;
    top: 16px;
    left: 16px;
    z-index: 20;
    width: 60px;
    height: 56px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    border: none;
    border-radius: 14px;
    background: rgba(0, 0, 0, 0.45);
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .burger:hover { transform: rotate(-8deg) scale(1.08); }
  .burger:focus-visible { outline: 3px solid #ffcc00; outline-offset: 3px; }
  .burger span { display: block; transition: transform 0.25s ease; }
  .bun-top {
    width: 40px;
    height: 14px;
    border-radius: 20px 20px 4px 4px;
    background:
      radial-gradient(ellipse 2.5px 1.5px at 25% 45%, #fff6d5 95%, transparent),
      radial-gradient(ellipse 2.5px 1.5px at 50% 30%, #fff6d5 95%, transparent),
      radial-gradient(ellipse 2.5px 1.5px at 72% 50%, #fff6d5 95%, transparent),
      radial-gradient(ellipse 2.5px 1.5px at 40% 70%, #fff6d5 95%, transparent),
      #e8a33d;
    box-shadow: inset 0 -3px 0 #c9852a;
  }
  .lettuce {
    width: 46px;
    height: 5px;
    border-radius: 3px;
    background: repeating-radial-gradient(circle at 50% 0, #6fd65a 0 3px, #4caf3a 3px 5px);
  }
  .cheese {
    position: relative;
    width: 42px;
    height: 4px;
    background: #ffd21f;
  }
  .cheese::after {   /* melty drip */
    content: "";
    position: absolute;
    left: 8px;
    top: 3px;
    border: 4px solid transparent;
    border-top: 6px solid #ffd21f;
  }
  .patty { width: 44px; height: 8px; border-radius: 5px; background: #6b3a1f; box-shadow: inset 0 -2px 0 #4a2612; }
  .bun-bottom { width: 40px; height: 8px; border-radius: 3px 3px 10px 10px; background: #e8a33d; box-shadow: inset 0 -2px 0 #c9852a; }
  /* When the menu is open the burger opens up */
  .burger.open .bun-top { transform: translateY(-4px) rotate(-6deg); }
  .burger.open .lettuce { transform: translateY(-2px); }
  .burger.open .bun-bottom { transform: translateY(3px); }

  /* Slide-out menu */
  .menu {
    position: fixed;
    top: 0;
    left: 0;
    z-index: 15;
    width: min(290px, 85vw);
    height: 100vh;
    overflow-y: auto;
    padding: 88px 14px 20px;
    box-sizing: border-box;
    background: rgba(10, 8, 30, 0.92);
    backdrop-filter: blur(6px);
    border-right: 1px solid rgba(255, 255, 255, 0.15);
    font-family: system-ui, -apple-system, sans-serif;
    transform: translateX(-105%);
    visibility: hidden;
    transition: transform 0.3s ease, visibility 0.3s;
  }
  .menu.open { transform: none; visibility: visible; }
  .menu h2 {
    font-family: "Pacifico", cursive;
    font-weight: normal;
    color: #ffcc00;
    margin: 0 0 10px 8px;
  }
  .menu a {
    display: block;
    padding: 10px 12px;
    border-radius: 10px;
    color: #fff;
    text-decoration: none;
    font-size: 1.05em;
  }
  .menu a:hover, .menu a:focus-visible { background: rgba(255, 255, 255, 0.12); outline: none; }
  .menu a.main { color: #222; background: #ffcc00; font-weight: bold; margin-bottom: 10px; }
  .menu a.main:hover { filter: brightness(1.1); }
</style>

<canvas id="stars"></canvas>
<h1 id="title">Hello from my arcade</h1>
<a class="play-btn" href="game.html">Play Games</a>

<script src="boing.js"></script>
<script>
  const title = document.getElementById("title");
  const letters = title.textContent.split("");
  title.textContent = "";

  letters.forEach((letter, i) => {
    const span = document.createElement("span");
    span.textContent = letter === " " ? " " : letter;
    span.style.color = `hsl(${(i / letters.length) * 300}, 100%, 65%)`;
    span.addEventListener("click", () => {
      span.classList.remove("bounce");
      void span.offsetWidth; // restart the animation if clicked again
      span.classList.add("bounce");
      boing(i / letters.length);
    });
    title.appendChild(span);
  });

  // Twinkling starfield
  const canvas = document.getElementById("stars");
  const ctx = canvas.getContext("2d");
  let stars = [];

  function resize() {
    canvas.width = innerWidth;
    canvas.height = innerHeight;
    stars = Array.from({ length: Math.floor(innerWidth * innerHeight / 2500) }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      phase: Math.random() * Math.PI * 2,
      speed: Math.random() * 0.03 + 0.01,
    }));
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.phase += s.speed;
      ctx.globalAlpha = 0.5 + 0.5 * Math.sin(s.phase);
      ctx.fillStyle = "#fff";
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(draw);
  }

  addEventListener("resize", resize);
  resize();
  draw();

  // Hamburger menu: click the burger to open/close; Esc or clicking outside closes it
  const burger = document.getElementById("burger");
  const menu = document.getElementById("menu");
  function setMenu(open) {
    menu.classList.toggle("open", open);
    burger.classList.toggle("open", open);
    burger.setAttribute("aria-expanded", open);
    burger.setAttribute("aria-label", open ? "Close menu" : "Open menu");
  }
  burger.addEventListener("click", () => {
    const open = !menu.classList.contains("open");
    setMenu(open);
    if (open) boing(0.2);
  });
  addEventListener("keydown", e => {
    if (e.key === "Escape" && menu.classList.contains("open")) {
      setMenu(false);
      burger.focus();
    }
  });
  addEventListener("click", e => {
    if (menu.classList.contains("open") && !menu.contains(e.target) && !burger.contains(e.target)) setMenu(false);
  });
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 – My Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
<link rel="stylesheet" href="arcade.css">
</head>
<body>
<!-- Mini games (Space Dodge, Block Stack, Snake) -->
<section class="screen" id="mini" hidden>
  <h2 id="miniTitle"></h2>
  <div class="mini-hud"><span id="miniScore"></span><span id="miniBest"></span></div>
  <canvas id="miniCanvas"></canvas>
  <p class="controls" id="miniControls"></p>
  <button class="secondary" id="miniBack">← Game library</button>
</section>

<script src="arcade.js"></script>
<script src="minigame.js"></script>
<script>
// 2048: slide tiles, equal numbers merge
const TILE_COLORS = {
  2: "#eee4da", 4: "#ede0c8", 8: "#f2b179", 16: "#f59563", 32: "#f67c5f", 64: "#f65e3b",
  128: "#edcf72", 256: "#edcc61", 512: "#edc850", 1024: "#edc53f", 2048: "#edc22e",
};
const g2048 = {
  id: "2048", title: "🔢 2048", w: 420, h: 420,
  controls: "Arrow keys or WASD to slide the tiles · Matching numbers merge",
  endText: "No more moves!",
  reset() {
    this.b = Array(16).fill(0);
    this.score = 0;
    this.won = false;
    this.add();
    this.add();
  },
  add() {
    const empty = this.b.map((v, i) => (v ? -1 : i)).filter(i => i >= 0);
    if (empty.length) this.b[empty[randInt(empty.length)]] = Math.random() < 0.9 ? 2 : 4;
  },
  // dir: 0 left, 1 right, 2 up, 3 down
  slide(dir) {
    let moved = false;
    for (let i = 0; i < 4; i++) {
      const idx = [0, 1, 2, 3].map(j => {
        const k = dir === 0 || dir === 2 ? j : 3 - j;
        return dir < 2 ? i * 4 + k : k * 4 + i;
      });
      const vals = idx.map(k => this.b[k]).filter(v => v);
      const out = [];
      for (let j = 0; j < vals.length; j++) {
        if (vals[j] === vals[j + 1]) {
          const v = vals[j] * 2;
          out.push(v);
          this.score += v;
          if (v === 2048) this.won = true;
          j++;
        } else {
          out.push(vals[j]);
        }
      }
      while (out.length < 4) out.push(0);
      idx.forEach((k, j) => {
        if (this.b[k] !== out[j]) moved = true;
        this.b[k] = out[j];
      });
    }
    if (moved) this.add();
  },
  canMove() {
    if (this.b.includes(0)) return true;
    for (let r = 0; r < 4; r++) {
      for (let col = 0; col < 4; col++) {
        const v = this.b[r * 4 + col];
        if ((col < 3 && v === this.b[r * 4 + col + 1]) || (r < 3 && v === this.b[r * 4 + col + 4])) return true;
      }
    }
    return false;
  },
  key(code) {
    const dir = { ArrowLeft: 0, KeyA: 0, ArrowRight: 1, KeyD: 1, ArrowUp: 2, KeyW: 2, ArrowDown: 3, KeyS: 3 }[code];
    if (dir !== undefined) this.slide(dir);
  },
  update() { return this.canMove(); },
  draw(c) {
    const pad = 12, s = (this.w - pad * 5) / 4;
    c.fillStyle = "#bbada0";
    c.fillRect(0, 0, this.w, this.h);
    c.textAlign = "center";
    c.textBaseline = "middle";
    this.b.forEach((v, i) => {
      const x = pad + (i % 4) * (s + pad), y = pad + Math.floor(i / 4) * (s + pad);
      c.fillStyle = v ? TILE_COLORS[v] || "#3c3a32" : "#cdc1b4";
      c.beginPath();
      if (c.roundRect) c.roundRect(x, y, s, s, 8); else c.rect(x, y, s, s);
      c.fill();
      if (v) {
        c.fillStyle = v <= 4 ? "#776e65" : "#fff";
        c.font = `bold ${v < 100 ? 44 : v < 1000 ? 36 : 28}px system-ui, sans-serif`;
        c.fillText(v, x + s / 2, y + s / 2 + 2);
      }
    });
    if (this.won) {
      c.fillStyle = "rgba(237,194,46,0.9)";
      c.fillRect(0, this.h - 40, this.w, 40);
      c.fillStyle = "#fff";
      c.font = "bold 18px system-ui, sans-serif";
      c.fillText("🏆 You made 2048! Keep going!", this.w / 2, this.h - 20);
    }
    c.textBaseline = "alphabetic";
  },
};

openMini(g2048);
</script>
</body>
</html>
